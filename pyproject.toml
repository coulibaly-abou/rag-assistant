[project]
name = "rag-assistant"
version = "0.1.0"
description = "Assistant RAG local sur mes cours (Ollama, Qdrant, FastAPI, Open WebUI)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["api", "."]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["api", "."]
testpaths = ["tests"]
